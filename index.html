<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
@font-face {
  font-family: "Patch Pixel";
  font-weight: 400;
  font-display: swap;
  src: url(gallery/fonts/PatchPixel-Regular.woff2) format("woff2");
}
:root {
  --ground: #000000;
  --panel: #111111;
  --stage: #15131d;
  --ink: #ffffff;
  --quiet: #999999;
  --line: #333333;
  --patch: #f53cd1;
  --display: "Patch Pixel", ui-monospace, "SFMono-Regular", monospace;
  --text: "Funnel Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.5 var(--text); padding-block: 0 48px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.head {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 32px 20px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.title { display: flex; gap: 18px; align-items: flex-start; }
.mark { width: 42px; height: 42px; flex: none; image-rendering: pixelated; margin-top: 4px; }
h1 { margin: 0; font: 400 54px/66px var(--display); }
.sub { margin: 4px 0 0; font: 500 17px/1.4 var(--text); color: var(--quiet); }
.links { display: flex; gap: 20px; font: 500 13px/1 var(--mono); letter-spacing: 0.04em; }
.links a { text-decoration: none; color: var(--quiet); padding: 6px 0; border-bottom: 1px solid var(--line); }
.links a:hover { color: var(--ink); border-color: var(--ink); }

main { max-width: 1240px; margin: 0 auto; padding-top: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { display: block; border: 1px solid var(--line); padding: 22px 24px; text-decoration: none; }
.card:hover { border-color: var(--ink); }
.card b { display: block; font: 400 24px/28px var(--display); }
.card small { display: block; margin-top: 6px; font: 400 12px/1.5 var(--mono); color: var(--quiet); letter-spacing: 0.04em; }
.card small::after { content: "\2192"; margin-left: 10px; color: var(--patch); }
.note { margin: 20px 0 0; font: 400 12px/1.6 var(--mono); color: var(--quiet); }
.note code { color: var(--ink); }

@media (max-width: 900px) {
  h1 { font-size: 36px; line-height: 44px; }
  .mark { width: 28px; height: 28px; }
}
</style>
</head>
<body>
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub">像素特效与动画，每一个都是一小段代码。</p>
    </div>
  </div>
  <nav class="links">
    <a href="gallery/">gallery</a>
    <a href="editor/">rig editor</a>
  </nav>
</header>

<main>
  <div class="cards">
    <a class="card" href="gallery/">
      <b>gallery</b>
      <small>every effect, playing live</small>
    </a>
    <a class="card" href="editor/">
      <b>rig editor</b>
      <small>drag the skeleton, export poses</small>
    </a>
  </div>
  <p class="note">这两个页面需要本地服务：在项目目录执行 <code>node tools/serve.mjs</code>，再打开 <code>http://localhost:8080/</code>。</p>
</main>
</body>
</html>
